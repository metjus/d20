    <symbol id="d20s" viewBox="0 0 42 42"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M21 2L38 11.5V30.5L21 40L4 30.5V11.5Z"/><path d="M21 9L31 26H11Z"/><path d="M21 2V9M4 11.5L11 26M38 11.5L31 26M21 40L11 26M21 40L31 26" opacity=".55"/></g></symbol>

<div class="boot" aria-hidden="true"><div class="boot-c"><div class="boot-ring"></div><img src="img/logo.png" alt=""><b>d20.sk</b></div></div>
<div class="warp" id="warp" aria-hidden="true"><div class="warp-c"><img src="img/logo.png" alt=""></div></div>
<div class="shell">
  <header class="top">
    <div class="wrap">
      <div class="top-inner">
        <a class="brand" href="#domov"><img src="img/logo.png" alt="" width="44" height="44"><b>d20<span>.sk</span></b></a>
        <nav class="menu" aria-label="Menu" id="menu"></nav>
        <div class="lang" role="group" aria-label="Jazyk / Language">
          <button type="button" id="lang-sk" data-lang="sk" aria-pressed="true">SK</button>
          <button type="button" id="lang-en" data-lang="en" aria-pressed="false">EN</button>
        </div>
      </div>
      <nav class="menu-mobile" aria-label="Menu" id="menu-m"></nav>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section class="page wrap" data-page="domov">
      <div class="hero">
        <div class="hero-copy">
          <p class="kicker"><svg class="sg"><use href="#sigil"/></svg><span data-i18n="home.eyebrow"></span></p>
          <h1><span data-i18n="home.h1a"></span><span class="gild" data-i18n="home.h1b"></span></h1>
          <p class="lede" data-i18n="home.lede"></p>
          <div class="actions">
            <a class="btn" href="#navody"><svg class="seal"><use href="#seal"/></svg><span data-i18n="home.cta1"></span></a>
            <a class="btn ghost" href="#postava" data-i18n="home.cta2"></a>
          </div>
        </div>
        <div class="orb">
          <div class="halo"></div>
          <svg class="r1" viewBox="0 0 400 400" id="rune-outer" aria-hidden="true"></svg>
          <svg class="r2" viewBox="0 0 400 400" id="rune-inner" aria-hidden="true"></svg>
          <a href="#kocky" data-i18n-aria="home.sigil"><img src="img/logo.png" alt="" width="354" height="351"></a>
        </div>
      </div>

      <div class="section-title">
        <p class="kicker"><svg class="sg"><use href="#sigil"/></svg><span data-i18n="map.kicker"></span></p>
        <h2 class="h2" data-i18n="map.h2"></h2>
      </div>
      <div class="leather map-frame">
        <svg class="brass tl"><use href="#brass"/></svg><svg class="brass tr"><use href="#brass"/></svg><svg class="brass bl"><use href="#brass"/></svg><svg class="brass br"><use href="#brass"/></svg>
        <div class="map parchment">
          <svg class="chart" id="chart" viewBox="0 0 1000 560" role="img" data-i18n-aria="map.aria"></svg>
          <div class="vignette"></div>
        </div>
        <div class="map-legend" id="map-legend"></div>
      </div>

      <div class="section-title" style="margin-top:80px">
        <p class="kicker"><svg class="sg"><use href="#sigil"/></svg><span data-i18n="cards.kicker"></span></p>
        <h2 class="h2" data-i18n="cards.h2"></h2>
      </div>
      <div class="cards">
        <article class="gcard"><div class="gcard-in parchment">
          <div class="gtype"><span data-i18n="cards.monster"></span><svg class="gem"><use href="#d20s"/></svg></div>
          <div class="gart" id="art-goblin"></div>
          <h3 class="gname" data-i18n="gob.name"></h3>
          <p class="gmeta" data-i18n="gob.meta"></p>
          <div class="taper"></div>
          <div class="sb"><p data-i18n="gob.ac"></p><p data-i18n="gob.hp"></p><p data-i18n="gob.speed"></p></div>
          <div class="taper"></div>
          <div class="abil" id="gob-abil"></div>
          <div class="taper"></div>
          <div class="sb"><p data-i18n="gob.trait"></p><p data-i18n="gob.atk"></p></div>
          <div class="groll"><button class="chipbtn" type="button" data-roll="1d20+4" data-out="gob-out" data-i18n="gob.b1"></button><button class="chipbtn" type="button" data-roll="1d6+2" data-out="gob-out" data-i18n="gob.b2"></button><span class="gout" id="gob-out">—</span></div>
          <p class="gnote" id="gob-out-n"></p>
        </div></article>

        <article class="gcard"><div class="gcard-in parchment">
          <div class="gtype"><span data-i18n="cards.spell"></span><svg class="gem"><use href="#d20s"/></svg></div>
          <div class="gart" id="art-fire"></div>
          <h3 class="gname" data-i18n="fb.name"></h3>
          <p class="gmeta" data-i18n="fb.meta"></p>
          <div class="taper"></div>
          <div class="sb"><p data-i18n="fb.time"></p><p data-i18n="fb.range"></p><p data-i18n="fb.comp"></p><p data-i18n="fb.dur"></p></div>
          <div class="taper"></div>
          <div class="sb"><p data-i18n="fb.text"></p></div>
          <div class="groll"><button class="chipbtn" type="button" data-roll="8d6" data-out="fb-out" data-i18n="fb.b1"></button><span class="gout" id="fb-out">—</span></div>
          <p class="gnote" id="fb-out-n"></p>
        </div></article>

        <article class="gcard"><div class="gcard-in parchment">
          <div class="gtype"><span data-i18n="cards.hero"></span><svg class="gem"><use href="#d20s"/></svg></div>
          <div class="gart" id="art-hero"></div>
          <h3 class="gname" id="hc-name"></h3>
          <p class="gmeta" id="hc-meta"></p>
          <div class="taper"></div>
          <div class="sb"><p id="hc-hp"></p><p id="hc-init"></p></div>
          <div class="taper"></div>
          <div class="abil" id="hc-abil"></div>
          <div class="taper"></div>
          <div class="sb"><p id="hc-lore"></p></div>
          <div class="groll"><button class="chipbtn" type="button" id="hc-new" data-i18n="hc.new"></button><a class="chipbtn" href="#postava" style="text-decoration:none" data-i18n="hc.open"></a></div>
        </div></article>
      </div>
    </section>

    <!-- GUIDES -->
    <section class="page wrap" data-page="navody" hidden>
      <div class="head">
        <p class="kicker"><svg class="sg"><use href="#sigil"/></svg><span data-i18n="g.eyebrow"></span></p>
        <h1 class="h1 gild" data-i18n="g.h1"></h1>
      </div>
      <div class="leather book">
        <svg class="brass tl"><use href="#brass"/></svg><svg class="brass tr"><use href="#brass"/></svg><svg class="brass bl"><use href="#brass"/></svg><svg class="brass br"><use href="#brass"/></svg>
        <div class="folio parchment">
          <p class="intro illum" data-i18n="g.intro"></p>
          <div class="fleuron"><svg><use href="#fleuron"/></svg></div>
          <ol class="chapters">
            <li class="chap"><div><h3 data-i18n="g.s1"></h3><p data-i18n="g.s1p"></p></div></li>
            <li class="chap"><div><h3 data-i18n="g.s2"></h3><p data-i18n="g.s2p"></p><p><a href="#postava" data-i18n="g.s2a"></a></p></div></li>
            <li class="chap"><div><h3 data-i18n="g.s3"></h3><p data-i18n="g.s3p"></p><div class="dice-row" id="dice-row"></div></div></li>
            <li class="chap"><div><h3 data-i18n="g.s4"></h3><p data-i18n="g.s4p"></p><p class="formula" data-i18n="g.s4f"></p></div></li>
            <li class="chap"><div><h3 data-i18n="g.s5"></h3><p data-i18n="g.s5p"></p><p><a href="#pribeh" data-i18n="g.s5a"></a></p></div></li>
          </ol>
          <div class="fleuron"><svg><use href="#fleuron"/></svg></div>
          <h2 class="h2" style="color:var(--rubric)" data-i18n="g.gloss"></h2>
          <dl class="gloss" id="gloss"></dl>
        </div>
      </div>
    </section>

    <!-- CHARACTER -->
    <section class="page wrap" data-page="postava" hidden>
      <div class="head">
        <p class="kicker"><svg class="sg"><use href="#sigil"/></svg><span data-i18n="c.eyebrow"></span></p>
        <h1 class="h1 gild" data-i18n="c.h1"></h1>
        <p class="lede" data-i18n="c.lede"></p>
      </div>
      <div class="tool">
        <div class="ctrl leather">
          <div>
            <label class="label" for="c-name" data-i18n="c.name"></label>
            <div class="field"><input class="input" id="c-name" type="text" maxlength="40" autocomplete="off">
              <button class="icon-btn" type="button" id="c-name-roll" data-i18n-aria="c.nameRoll"><svg><use href="#i-dice"/></svg></button></div>
          </div>
          <div><span class="label" data-i18n="c.species"></span><div class="opts" id="c-species"></div></div>
          <div><span class="label" data-i18n="c.class"></span><div class="opts" id="c-class"></div></div>
          <div><span class="label" data-i18n="c.method"></span>
            <div class="opts" id="c-method">
              <button class="opt" type="button" data-m="roll" aria-pressed="true" data-i18n="c.m1"></button>
              <button class="opt" type="button" data-m="array" aria-pressed="false" data-i18n="c.m2"></button>
            </div>
            <p class="note" style="margin-top:8px" data-i18n="c.mnote"></p>
          </div>
          <button class="btn wide" type="button" id="c-roll"><svg class="seal"><use href="#seal"/></svg><span data-i18n="c.reroll"></span></button>
        </div>
        <article class="sheet parchment" aria-live="polite">
          <svg class="brass tl"><use href="#brass"/></svg><svg class="brass br"><use href="#brass"/></svg>
          <svg class="seal-big"><use href="#seal"/></svg>
          <h2 class="nm" id="s-name"></h2>
          <p class="sub" id="s-sub"></p>
          <div class="taper"></div>
          <div class="sb"><p id="s-hp"></p><p id="s-hd"></p><p id="s-init"></p></div>
          <div class="taper"></div>
          <div class="stats" id="s-stats"></div>
          <div class="taper"></div>
          <div class="lore"><p id="s-sp"></p><p id="s-cl"></p></div>
        </article>
      </div>
    </section>

    <!-- STORY -->
    <section class="page wrap" data-page="pribeh" hidden>
      <div class="head">
        <p class="kicker"><svg class="sg"><use href="#sigil"/></svg><span data-i18n="t.eyebrow"></span></p>
        <h1 class="h1 gild" data-i18n="t.h1"></h1>
        <p class="lede" data-i18n="t.lede"></p>
      </div>
      <div class="tool">
        <div class="board leather"><div id="tale" style="display:grid;gap:14px"></div></div>
        <div class="tale-side">
          <div class="wanted parchment"><span class="nail"></span>
            <p class="t" data-i18n="t.wanted"></p>
            <div class="fleuron" style="width:100%"><svg><use href="#fleuron"/></svg></div>
            <p class="q" id="t-sum"></p>
          </div>
          <button class="btn wide" type="button" id="t-roll"><svg class="seal"><use href="#i-dice"/></svg><span id="t-roll-l"></span></button>
          <p class="note" data-i18n="t.note"></p>
        </div>
      </div>
    </section>

    <!-- DICE -->
    <section class="page wrap" data-page="kocky" hidden>
      <div class="head">
        <p class="kicker"><svg class="sg"><use href="#sigil"/></svg><span data-i18n="d.eyebrow"></span></p>
        <h1 class="h1 gild" data-i18n="d.h1"></h1>
        <p class="lede" data-i18n="d.lede"></p>
      </div>
      <div class="dice">
        <div class="ctrl leather">
          <div><span class="label" data-i18n="d.die"></span><div class="dpick" id="d-pick"></div></div>
          <div class="row">
            <div><span class="label" data-i18n="d.count"></span><div class="stepper"><button type="button" id="d-cm" aria-label="−1">−</button><output id="d-c">1</output><button type="button" id="d-cp" aria-label="+1">+</button></div></div>
            <div><span class="label" data-i18n="d.mod"></span><div class="stepper"><button type="button" id="d-mm" aria-label="−1">−</button><output id="d-m">+0</output><button type="button" id="d-mp" aria-label="+1">+</button></div></div>
          </div>
          <div><span class="label" data-i18n="d.mode"></span>
            <div class="opts" id="d-mode">
              <button class="opt" type="button" data-mode="normal" aria-pressed="true" data-i18n="d.normal"></button>
              <button class="opt" type="button" data-mode="adv" aria-pressed="false" data-i18n="d.adv"></button>
              <button class="opt" type="button" data-mode="dis" aria-pressed="false" data-i18n="d.dis"></button>
            </div></div>
          <div><span class="label" data-i18n="d.presets"></span><div class="presets" id="d-presets"></div></div>
          <button class="btn wide" type="button" id="d-roll"><svg class="seal"><use href="#seal"/></svg><span id="d-roll-l"></span></button>
        </div>
        <div>
          <div class="altar" aria-live="polite">
            <canvas id="dice3d" data-i18n-aria="d.stage" role="img"></canvas>
            <div class="total" id="d-total" hidden></div>
            <p class="verdict" id="d-verdict"></p>
            <p class="breakdown" id="d-break"></p>
          </div>
          <div class="slip parchment"><span class="label" data-i18n="d.hist"></span><ul class="hist" id="d-hist"></ul></div>
        </div>
      </div>
    </section>
    <!-- PRIVACY -->
    <section class="page wrap" data-page="sukromie" hidden>
      <div class="head">
        <p class="kicker"><svg class="sg"><use href="#sigil"/></svg><span data-i18n="pv.eyebrow"></span></p>
        <h1 class="h1 gild" data-i18n="pv.h1"></h1>
      </div>
      <div class="leather book">
        <svg class="brass tl"><use href="#brass"/></svg><svg class="brass tr"><use href="#brass"/></svg><svg class="brass bl"><use href="#brass"/></svg><svg class="brass br"><use href="#brass"/></svg>
        <div class="folio parchment legal" data-i18n="pv.body"></div>
      </div>
    </section>
  </main>

  <dialog class="ct" id="ct" aria-labelledby="ct-h">
    <div class="leather ct-frame">
      <svg class="brass tl"><use href="#brass"/></svg><svg class="brass tr"><use href="#brass"/></svg><svg class="brass bl"><use href="#brass"/></svg><svg class="brass br"><use href="#brass"/></svg>
      <div class="parchment ct-sheet">
        <button class="ct-x" type="button" id="ct-close" data-i18n-aria="ct.close">&times;</button>
        <form id="ct-form" novalidate>
          <h2 id="ct-h" data-i18n="ct.h"></h2>
          <p class="ct-lede" data-i18n="ct.lede"></p>
          <div class="ct-row">
            <label class="ct-f"><span data-i18n="ct.name"></span><input class="input" id="ct-name" name="name" type="text" maxlength="80" autocomplete="name"></label>
            <label class="ct-f"><span data-i18n="ct.email"></span><input class="input" id="ct-email" name="email" type="email" maxlength="160" autocomplete="email" required></label>
          </div>
          <fieldset class="ct-topic">
            <legend data-i18n="ct.topic"></legend>
            <label><input type="radio" name="topic" value="idea" checked><span data-i18n="ct.t.idea"></span></label>
            <label><input type="radio" name="topic" value="bug"><span data-i18n="ct.t.bug"></span></label>
            <label><input type="radio" name="topic" value="collab"><span data-i18n="ct.t.collab"></span></label>
            <label><input type="radio" name="topic" value="other"><span data-i18n="ct.t.other"></span></label>
          </fieldset>
          <label class="ct-f"><span data-i18n="ct.msg"></span><textarea class="input" id="ct-msg" name="message" rows="6" maxlength="4000" required></textarea></label>
          <div class="ct-hp" aria-hidden="true"><label>Web <input type="text" name="website" id="ct-web" tabindex="-1" autocomplete="off"></label></div>
          <label class="ct-consent"><input type="checkbox" id="ct-ok" name="consent" value="1" required><span data-i18n="ct.consent"></span></label>
          <p class="ct-err" id="ct-err" role="alert" hidden></p>
          <button class="btn" type="submit" id="ct-send"><svg class="seal"><use href="#seal"/></svg><span data-i18n="ct.send"></span></button>
        </form>
        <div class="ct-done" id="ct-done" hidden tabindex="-1">
          <svg class="ct-stamp" aria-hidden="true"><use href="#seal"/></svg>
          <h2 data-i18n="ct.doneH"></h2>
          <p data-i18n="ct.done"></p>
          <button class="btn ghost" type="button" id="ct-again" data-i18n="ct.closeBtn"></button>
        </div>
      </div>
